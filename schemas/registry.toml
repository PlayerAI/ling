[version_policy]
major_minor = "A marker identifies one concrete schema. Major or minor changes have no implicit compatibility; every compatible reader or migration edge requires registered executable evidence."
integer = "An integer increment identifies a different revision and has no implicit compatibility; public formats retain their public protocol marker."
writer = "CurrentOnly"
n_minus_one = "NoPreviousVersion is distinct from supported N-1 reading or migration."
semantic_identity = "Ordinary JSON member order is never a Semantic ID input; DEC-0012 domain-separated canonical bytes and explicit hash scheme IDs remain authoritative."

