name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  g0-gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: governance-authority
            command: |
              cargo xtask governance check-authority
              cargo xtask governance check-lifecycle
              cargo xtask governance check-all
              cargo xtask ci verify
          - name: gap-register
            command: cargo xtask governance check-gaps
          - name: protocol-schema
            command: |
              cargo xtask governance check-protocols
              cargo xtask schema validate-all
              cargo xtask schema compatibility --from N-1 --to N
              cargo xtask schema corrupt-inputs
          - name: error-code-registry
            command: cargo xtask governance check-error-codes
          - name: traceability-links
            command: cargo xtask traceability verify --release v0.0.1
          - name: support-matrix
            command: |
              cargo xtask support verify
              cargo xtask status verify
          - name: canonical-determinism
            command: |
              cargo test --package ling-semantic hello_snapshot_is_byte_deterministic --locked --offline
              cargo test --package ling-cli --test conformance output_is_deterministic --locked --offline
          - name: seed-reproducibility
            command: |
              cargo xtask fault verify
              cargo xtask fuzz verify
              cargo xtask security verify
              cargo xtask performance verify
              cargo run --package unicode-gen --locked --offline
              git diff --exit-code -- crates/ling-unicode/src/generated.rs editors/tree-sitter-ling/src/unicode-identifiers.generated.js
              cargo xtask seed reproduce
              cargo test --package ling-cli --test conformance seed_examples_check_run_and_emit_semantic_graphs --locked --offline

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      # Always-on PR gates are a conservative superset of path-specific triggers.
      - name: Run ${{ matrix.name }}
        shell: bash
        run: ${{ matrix.command }}

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked --offline
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked --offline
      - name: Build release profile
        run: cargo build --workspace --all-features --release --locked --offline

  fuzz-smoke:
    name: fuzz corpus smoke
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-15
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fetch locked fuzz dependencies
        run: cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Replay Source corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run source_bytes fuzz/corpus/source_bytes -- -runs=256 -timeout=120 -rss_limit_mb=2048
      - name: Replay Lexer corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run lexer_utf8 fuzz/corpus/lexer_utf8 -- -runs=256 -timeout=120 -rss_limit_mb=2048
      - name: Replay Parser and AST corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run parser_utf8 fuzz/corpus/parser_utf8 -- -runs=256 -timeout=120 -rss_limit_mb=2048
      - name: Replay formatter corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run formatter_utf8 fuzz/corpus/formatter_utf8 -- -runs=256 -timeout=120 -rss_limit_mb=2048
      - name: Replay Audit schema corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run audit_schema_bytes fuzz/corpus/audit_schema_bytes -- -runs=256 -timeout=120 -rss_limit_mb=2048
      - name: Replay project manifest corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run manifest_bytes fuzz/corpus/manifest_bytes -- -runs=256 -timeout=120 -rss_limit_mb=2048
      - name: Replay project lock corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run lock_bytes fuzz/corpus/lock_bytes -- -runs=256 -timeout=120 -rss_limit_mb=2048
      - name: Replay bytecode decoder and verifier corpus
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run bytecode_bytes fuzz/corpus/bytecode_bytes -- -runs=256 -timeout=120 -rss_limit_mb=2048

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check declared MSRV
        run: cargo check --workspace --all-features --locked --offline
