[[protocol]]
id = "PROTO-SEMANTIC-GRAPH-JSON"
title = "Semantic Graph JSON"
category = "JSON"
visibility = "Public"
current_version = "ling.semantic/0.1"
stability = "Experimental"
implemented = true
public_schema = true
canonical = true
producer = ["ling-semantic snapshot writer", "ling semantic"]
consumer = ["ling-semantic isolated reader", "ling audit projection", "AI and editor tooling experiments"]
reader_policy = "Require the exact semantic, language, and Unicode versions; validate IDs, kinds, ownership, references, Prelude invariants, and ordering-independent structure; the returned graph is data only and cannot enter evaluation."
writer_policy = "Emit deterministic JSON from checked Typed Core with canonical ordering and no source paths, hash-map order, arena indices, allocation addresses, or Rust debug data in identity."
unknown_field_policy = "Accept x-* extension fields at checked object levels and reject unknown core fields."
migration_tool = "None; schema or identity changes require an explicit version upgrade, migration notes, and regenerated fixtures."
