[[protocol]]
id = "PROTO-AUDIT-SOURCE"
title = "Canonical Audit Source"
category = "Text protocol"
visibility = "Public"
current_version = "ling.audit/0.1"
stability = "Preview"
implemented = true
public_schema = true
canonical = true
producer = ["ling-format Audit renderer", "ling audit"]
consumer = ["ling-format isolated Audit parser", "independent audit tooling"]
reader_policy = "Require the exact Audit version; parse into an isolated AuditModel, validate semantic/reference invariants, and never convert the result to CheckedProgram or evaluator input."
writer_policy = "Emit one BOM-free UTF-8/LF/two-space canonical document with fixed ordering, JSON string escaping, implemented Seed fields only, and exactly one final LF."
unknown_field_policy = "Accept and discard x-* extension fields, accept input field reordering, and reject unknown core fields."
migration_tool = "None; incompatible grammar/model changes upgrade ling.audit/* and must document compatibility with the referenced Semantic Schema."
