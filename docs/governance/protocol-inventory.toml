  "Accepted RFC-0019 is implemented by VM-1209: the table-driven harness compares checked-interpreter and verifier-created VM logical events, Unit results, stable Fault projections, source spans, committed state, and deterministic ProgramId values.",
  "Accepted RFC-0020 is implemented by VM-1210: the existing bytecode protocol gains bounded decoder/resource/cancellation evidence, while the experimental ling.vm.control/0.1 host API is inventoried separately and makes no wire or CLI promise.",
