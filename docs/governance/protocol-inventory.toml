writer_policy = "The library-only writers accept checked-source lowering output or independently verified models. The 1.0 writer emits RFC-0014; the 1.1 writer emits RFC-0015 closure/recursion; the 1.2 writer emits RFC-0016 aggregate/match records and instructions with canonical type, field, case, update, and source-map order, zero reserved bytes, and path-free metadata under hard and caller-supplied limits. No CLI artifact contract is published."
unknown_field_policy = "Each revision rejects unknown tags, opcodes, flags, fields, nonzero reserved bytes, incompatible versions, and trailing bytes. A reader rejects every newer revision and accepts only the explicitly supported earlier records."
