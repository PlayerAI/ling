sources = ["crates/ling-semantic/src/lib.rs", "docs/decisions/0012-semantic-identity-and-canonical-bytes.md"]
version_markers = ["ling.semantic/0.1"]
authority = ["DEC-0012"]
notes = ["GAP-SEMANTIC-PROTOCOL-LIFECYCLE-001 keeps Stable versus Experimental fields and cross-version migration open."]

[[protocol]]
id = "PROTO-CANONICAL-BYTES"
title = "Canonical bytes for semantic identities"
category = "Canonical identity"
visibility = "Public"
current_version = "v1 domain encodings"
stability = "Experimental"
implemented = true
public_schema = false
canonical = true
producer = ["ling-resolve identity encoder", "ling-semantic identity encoders"]
consumer = ["DefinitionId, REPL DefinitionId, BodyId, ProgramId, and semantic node ID hashers"]
reader_policy = "No general decoder is exposed; each identity class consumes only its own domain-separated, length-prefixed canonical input."
writer_policy = "Use distinct v1 ASCII domains, version inputs, normalized checked semantics, explicit lengths and values, and canonical collection ordering; exclude spans, paths, comments, spelling, arena indices, and hash-map iteration."
unknown_field_policy = "Closed binary projection: unrecognized semantic inputs cannot be appended without a domain/schema version change."
migration_tool = "None; an encoding or normalization change requires a Semantic Schema or ID-prefix upgrade and migration explanation."
fixtures = ["crates/ling-resolve/src/lib.rs", "crates/ling-semantic/src/lib.rs"]
sources = ["crates/ling-resolve/src/lib.rs", "crates/ling-semantic/src/lib.rs", "docs/decisions/0012-semantic-identity-and-canonical-bytes.md"]
version_markers = ["ling.definition-id/v1", "ling.repl-definition-id/v1", "ling.body-id/v1", "ling.program-id/v1", "ling.semantic-node-id/v1"]
authority = ["DEC-0012"]
notes = ["The domains are versioned separately in current code; no invented umbrella wire identifier is claimed."]

