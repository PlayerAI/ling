[[protocol]]
id = "PROTO-CLI"
title = "Ling command and option surface"
category = "CLI"
visibility = "Public"
current_version = "0.0.1-dev"
stability = "Preview"
implemented = true
public_schema = false
canonical = false
producer = ["ling executable"]
consumer = ["humans", "shell scripts", "editor and build integrations"]
reader_policy = "The hand-written parser accepts --help/-h, --version/-V, run, check, semantic, audit, repl, --format human|json, and the REPL-only --capability Console.Write; unknown commands/options and invalid arity are rejected with exit 2."
writer_policy = "Help and version output describe only implemented commands; commands route through the shared checked compiler pipeline, and no placeholder command is advertised."
unknown_field_policy = "Not field-based: unknown commands, options, formats, and capabilities are rejected."
migration_tool = "None; incompatible command or option changes require an accepted specification and release migration notes."
fixtures = ["crates/ling-cli/src/main.rs", "crates/ling-cli/tests/conformance.rs"]
sources = ["Cargo.toml", "crates/ling-cli/src/main.rs"]
version_markers = ["0.0.1-dev"]
authority = ["DEC-0003", "DEC-0013", "DEC-0015", "DEC-0016"]
notes = ["The compiler package version is the current CLI version; no independent CLI schema identifier exists."]

[[protocol]]
id = "PROTO-CLI-EXIT"
title = "Ling process exit-code mapping"
category = "CLI"
visibility = "Public"
current_version = "0.0.1-dev"
stability = "Preview"
implemented = true
public_schema = false
canonical = true
producer = ["ling process"]
consumer = ["shells", "CI jobs", "editor and build integrations"]
reader_policy = "Interpret 0 as success, 1 as compile/check failure, 2 as invalid usage, 4 as runtime or host fault, 5 as internal compiler error, and 6 as semantic snapshot mismatch; 3 is reserved and unreachable in Seed."
writer_policy = "Human versus JSON rendering never changes the exit class; run and scripted REPL preserve the accepted compile/runtime distinction."
unknown_field_policy = "Not field-based: unassigned exit values have no compatibility meaning."
migration_tool = "None; changing an assigned meaning requires an accepted decision and explicit compatibility guidance."
fixtures = ["crates/ling-cli/tests/conformance.rs", "tests/conformance/p7-hello-run/expect.toml", "tests/conformance/p12-text-format-fault/expect.toml"]
sources = ["Cargo.toml", "crates/ling-cli/src/main.rs"]
version_markers = ["0.0.1-dev"]
authority = ["DEC-0013", "DEC-0016"]
notes = ["Exit 3 remains reserved for a future accepted Result-returning main and is not current behavior."]

[[protocol]]
