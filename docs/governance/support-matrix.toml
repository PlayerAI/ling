[[unsupported]]
id = "UNSUP-PROFILE-SELECTION"
area = "Profile"
capability = "Explore, Native, or Critical selection/enforcement"
reason = "The Seed CLI has no profile option and no profile validation pass."
blockers = ["GAP-CRITICAL-PROFILE-001", "GAP-NATIVE-BACKEND-ABI-001"]
sources = ["docs/SEMANTICS.md", "docs/ROADMAP-1.0.md"]

[[unsupported]]
id = "UNSUP-SUPPORT-CLI-JSON"
area = "CLI/protocol"
capability = "ling version --format json and ling support --format json"
reason = "GOV-0108 generates internal governance fixtures only; no Accepted public JSON contract or CLI command exists."
blockers = []
sources = ["docs/ling_execution_plan/02-G0-GOVERNANCE-AND-COMPATIBILITY.md"]

[[unsupported]]
id = "UNSUP-PACKAGES"
area = "Project/package"
capability = "Package installation, publication, or registry distribution"
reason = "Accepted DEC-0228 defers registry behavior through Ling 1.0. RFC-0002 local manifest, content identity, vendored dependency, project-check, and lock workflows remain available at their recorded stability, while publication, installation, and registry distribution remain Unsupported."
blockers = []
sources = ["docs/RFC-0002.md", "docs/decisions/0228-registry-deferred-through-v1.md", "docs/ling_execution_plan/10-G6-V1.0-STABILIZATION.md"]

[[unsupported]]
id = "UNSUP-VM"
area = "Execution"
capability = "CLI bytecode emission/loading and VM backend selection"
reason = "VM-1201 through VM-1210 provide Experimental versioned bytecode, verifier-gated library execution, differential/resource/cancellation evidence, and the separate ling.vm.control/0.1 host API. No Accepted CLI bytecode command, backend selector, default execution limits, or full-Seed VM lowering contract exists."
blockers = []
sources = ["docs/RFC-0014.md", "docs/RFC-0020.md", "crates/ling-bytecode/src/lib.rs", "crates/ling-vm/src/lib.rs", "tests/bytecode/README.md", "docs/ling_execution_plan/03-G1-V0.1-LIVING.md"]

[[unsupported]]
id = "UNSUP-NATIVE-FFI"
area = "Native"
capability = "Native code generation, stable ABI, FFI, or target artifacts"
reason = "Ownership, target, ABI, and FFI contracts are unresolved and unimplemented."
blockers = ["GAP-OWNERSHIP-MODEL-001", "GAP-NATIVE-BACKEND-ABI-001"]
sources = ["docs/governance/gap-register.toml"]

[[unsupported]]
id = "UNSUP-CONCURRENCY-REPLAY"
area = "Concurrency/runtime"
capability = "Task, Actor, remote delivery, supervision, or deterministic Replay"
reason = "The corresponding semantics and runtime protocols remain future work."
blockers = [
  "GAP-STRUCTURED-TASK-001",
  "GAP-ACTOR-AWAIT-REENTRY-001",
  "GAP-ACTOR-REMOTE-DELIVERY-001",
  "GAP-ACTOR-MAILBOX-SUPERVISOR-001",
  "GAP-DETERMINISTIC-REPLAY-001",
]
sources = ["docs/governance/gap-register.toml"]

[[unsupported]]
id = "UNSUP-DEVICE"
area = "Heterogeneous"
capability = "Kernel, SIMD, GPU, TPU/NPU, Device Buffer, or Placement"
reason = "No accepted Kernel/device subset, capability discovery, or backend exists."
blockers = ["GAP-KERNEL-DEVICE-001"]
sources = ["docs/governance/gap-register.toml"]

[[unsupported]]
id = "UNSUP-CRITICAL"
area = "Critical"
capability = "Critical Core, Node timing guarantees, Contract verification, model checking, or evidence bundles"
reason = "The minimum verifiable Critical boundary remains unresolved and unimplemented."
blockers = ["GAP-CRITICAL-PROFILE-001"]
sources = ["docs/governance/gap-register.toml"]

[[unsupported]]
id = "UNSUP-LSP-EDITOR"
area = "Tooling"
capability = "LSP document features, Zed extension, or semantic mutation"
reason = "RFC-0004, RFC-0023, RFC-0026, and RFC-0032 implement the bounded lifecycle, document overlay, whole-document formatting response, and deterministic push diagnostics. Pull diagnostics, navigation, remaining document features, range/on-type formatting, Zed integration, semantic mutation, and general transaction boundaries remain unresolved."
blockers = [
  "GAP-LSP-TRANSACTION-PROTOCOL-001",
  "GAP-FORMATTER-AUTHOR-SOURCE-001",
  "GAP-SEMANTIC-PROTOCOL-LIFECYCLE-001",
]
sources = ["docs/governance/gap-register.toml", "docs/RFC-0032.md"]
