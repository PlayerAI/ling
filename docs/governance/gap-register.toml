title = "Seed boolean operator syntax, precedence, and short-circuit boundary"
status = "Accepted"
priority = "P0"
blocked_releases = ["v0.1"]
blocked_tasks = ["TS-3105"]
observable_behavior = "Draft SEMANTICS specifies short-circuit && and ||, while RFC-0001's Seed EBNF omits them and the compiler lexer has tokens that the parser rejects; an editor grammar cannot determine acceptance or precedence."
