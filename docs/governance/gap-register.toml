  "Accept && and || for v0.1 with explicit precedence, associativity, short-circuit Typed Core lowering, diagnostics, and differential tests.",
  "Explicitly defer the operators beyond v0.1, retain deterministic syntax errors, and correct the semantics and execution-plan claims.",
]
irreversible_consequences = ["Operator acceptance and precedence affect source parsing, evaluation order, formatter output, Tree-sitter CST compatibility, and future source migration."]
required_evidence = ["positive", "negative", "migration", "precedence", "short-circuit", "compiler-tree-sitter-differential"]
owner_role = "language-syntax-design"
next_action = "Implement TS-3105 against DEC-0017 and preserve its compiler/Tree-sitter, type, short-circuit, migration, and span evidence."
resolution = ["DEC-0017"]
